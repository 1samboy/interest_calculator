<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monthly Interest Rate Calculator</title>

    <meta name="theme-color" content="#0a0e1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Rate Finder">
    <meta name="application-name" content="Rate Finder">

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'><rect width='256' height='256' rx='56' fill='%230a0e1a'/><rect width='256' height='256' rx='56' fill='url(%23grad)' opacity='0.3'/><defs><linearGradient id='grad' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%233b82f6'/><stop offset='100%' stop-color='%238b5cf6'/></linearGradient></defs><text x='50%' y='55%' font-family='sans-serif' font-weight='800' font-size='140' fill='%23ffffff' text-anchor='middle' dominant-baseline='middle'>%</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'><rect width='256' height='256' rx='56' fill='%230a0e1a'/><rect width='256' height='256' rx='56' fill='url(%23grad)' opacity='0.3'/><defs><linearGradient id='grad' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%233b82f6'/><stop offset='100%' stop-color='%238b5cf6'/></linearGradient></defs><text x='50%' y='55%' font-family='sans-serif' font-weight='800' font-size='140' fill='%23ffffff' text-anchor='middle' dominant-baseline='middle'>%</text></svg>">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: #0a0e1a;
            /* Prevents pull-to-refresh on mobile when installed as an app */
            overscroll-behavior-y: none; 
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: transparent;
            min-height: 100vh;
            height: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            position: relative;
            overflow-x: hidden;
            /* Better text rendering for mobile apps */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(236, 72, 153, 0.04) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .card {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 28px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 440px;
            height: auto;
            border: 1px solid rgba(148, 163, 184, 0.1);
            box-shadow: 
                0 0 0 1px rgba(255, 255, 255, 0.03),
                0 25px 80px -20px rgba(0, 0, 0, 0.6),
                0 0 60px -15px rgba(59, 130, 246, 0.1);
            position: relative;
            z-index: 1;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            margin-bottom: 2rem;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .glow-orb {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
        }

        .glow-orb.blue {
            background: #3b82f6;
            top: -60px;
            right: -60px;
        }

        .glow-orb.purple {
            background: #8b5cf6;
            bottom: -60px;
            left: -60px;
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .icon-wrapper {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem;
            box-shadow: 0 10px 40px -10px rgba(59, 130, 246, 0.5);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .icon-wrapper svg {
            width: 32px;
            height: 32px;
            color: white;
        }

        h1 {
            color: #f8fafc;
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #64748b;
            font-size: 0.95rem;
            font-weight: 400;
        }

        .input-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #94a3b8;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 0.625rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .input-icon {
            width: 16px;
            height: 16px;
            color: #3b82f6;
        }

        .input-wrapper {
            position: relative;
        }

        .currency-symbol {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 1rem;
            font-weight: 500;
            pointer-events: none;
            transition: color 0.2s;
        }

        input {
            width: 100%;
            padding: 1rem 1rem 1rem 2.5rem;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid rgba(148, 163, 184, 0.15);
            border-radius: 16px;
            color: #f1f5f9;
            font-size: 1.15rem;
            font-weight: 600;
            font-family: inherit;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            outline: none;
            /* Removes iOS inner shadow on inputs */
            -webkit-appearance: none;
        }

        input:focus {
            border-color: #3b82f6;
            background: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1), 0 0 20px -5px rgba(59, 130, 246, 0.2);
        }

        input::placeholder {
            color: #475569;
            font-weight: 400;
        }

        .result-box {
            margin-top: 2.5rem;
            padding: 2rem 1.5rem;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.15), rgba(139, 92, 246, 0.15));
            border-radius: 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(59, 130, 246, 0.2);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .result-box.has-value {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.25), rgba(139, 92, 246, 0.25));
            border-color: rgba(59, 130, 246, 0.4);
            box-shadow: 0 0 40px -10px rgba(59, 130, 246, 0.3);
        }

        .result-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }

        .result-label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 0.75rem;
            position: relative;
            z-index: 1;
        }

        .result-value {
            color: #ffffff;
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: -0.03em;
            position: relative;
            z-index: 1;
            text-shadow: 0 0 40px rgba(59, 130, 246, 0.5);
            transition: all 0.3s ease;
        }

        .result-value.updating {
            transform: scale(1.05);
            color: #60a5fa;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(148, 163, 184, 0.2), transparent);
            margin: 2rem 0;
        }

        .error {
            color: #f87171;
            font-size: 0.85rem;
            margin-top: 0.75rem;
            text-align: center;
            font-weight: 500;
            display: none;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .input-group {
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) backwards;
        }

        .input-group:nth-child(2) { animation-delay: 0.1s; }
        .input-group:nth-child(3) { animation-delay: 0.2s; }
        .input-group:nth-child(4) { animation-delay: 0.3s; }

        .bottom-footer {
            position: absolute;
            bottom: 1.5rem;
            left: 0;
            width: 100%;
            text-align: center;
            color: #475569;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            z-index: 10;
        }

        @media (max-width: 480px) {
            .card {
                padding: 2rem 1.5rem;
                border-radius: 24px;
            }
            h1 {
                font-size: 1.5rem;
            }
            .result-value {
                font-size: 2.5rem;
            }
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="glow-orb blue"></div>
    <div class="glow-orb purple"></div>

    <div class="card">
        <div class="header">
            <div class="icon-wrapper">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18L9 11.25l4.306 4.307a11.95 11.95 0 015.814-5.519l2.74-1.22m0 0l-5.94-2.28m5.94 2.28l-2.28 5.941" />
                </svg>
            </div>
            <h1>Interest Rate Finder</h1>
            <p class="subtitle">Reverse-calculate your monthly rate</p>
        </div>

        <div class="input-group">
            <label>
                <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v12m-3-2.818l.879.659c1.171.879 3.07.879 4.242 0 1.172-.879 1.172-2.303 0-3.182C13.536 12.219 12.768 12 12 12c-.725 0-1.45-.22-2.003-.659-1.106-.879-1.106-2.303 0-3.182s2.9-.879 4.006 0l.415.33M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                Loan Amount
            </label>
            <div class="input-wrapper">
                <span class="currency-symbol">₱</span>
                <input type="text" inputmode="decimal" id="loanAmount" placeholder="250,000">
            </div>
        </div>

        <div class="input-group">
            <label>
                <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 8.25h19.5M2.25 9h19.5m-16.5 5.25h6m-6 2.25h3m-3.75 3h15a2.25 2.25 0 002.25-2.25V6.75A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25v10.5A2.25 2.25 0 004.5 19.5z" />
                </svg>
                Monthly Amortization
            </label>
            <div class="input-wrapper">
                <span class="currency-symbol">₱</span>
                <input type="text" inputmode="decimal" id="monthlyPayment" placeholder="1,419.47">
            </div>
        </div>

        <div class="input-group">
            <label>
                <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5" />
                </svg>
                Number of Months
            </label>
            <div class="input-wrapper">
                <input type="text" inputmode="numeric" id="months" placeholder="360" style="padding-left: 1rem;">
            </div>
        </div>

        <div class="divider"></div>

        <div class="result-box" id="resultBox">
            <div class="result-label">Monthly Interest Rate</div>
            <div class="result-value" id="monthlyRate">0.00%</div>
        </div>
        <div class="error" id="errorMsg">Invalid inputs — total payment must exceed principal</div>
    </div>

    <div class="bottom-footer">&copy; 2026 PLV IT Solutions. All rights reserved.</div>

    <script>
        const loanAmount = document.getElementById('loanAmount');
        const monthlyPayment = document.getElementById('monthlyPayment');
        const months = document.getElementById('months');
        const monthlyRateDisplay = document.getElementById('monthlyRate');
        const resultBox = document.getElementById('resultBox');
        const errorMsg = document.getElementById('errorMsg');

        // Function to format inputs with commas and handle decimals
        function formatNumberInput(input) {
            let value = input.value.replace(/[^\d.]/g, ''); // Remove non-numeric except dot
            
            // Prevent multiple dots
            const parts = value.split('.');
            if (parts.length > 2) {
                value = parts[0] + '.' + parts.slice(1).join('');
            }
            
            // Format thousands with commas for the whole number part
            if (value !== '') {
                const splitValue = value.split('.');
                splitValue[0] = splitValue[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
                input.value = splitValue.join('.');
            } else {
                input.value = '';
            }
            
            calculate();
        }

        // Helper to convert comma-separated strings back to floats
        function getRawValue(val) {
            if (!val) return 0;
            return parseFloat(val.replace(/,/g, ''));
        }

        function calculate() {
            const P = getRawValue(loanAmount.value);
            const A = getRawValue(monthlyPayment.value);
            const n = getRawValue(months.value);

            errorMsg.style.display = 'none';
            resultBox.classList.remove('has-value');

            // Check if inputs are empty or zero
            if (isNaN(P) || isNaN(A) || isNaN(n) || P <= 0 || A <= 0 || n <= 0) {
                monthlyRateDisplay.textContent = '0.00%';
                return;
            }

            // Check if Total Payment is less than or equal to Principal
            if (A * n <= P) {
                monthlyRateDisplay.textContent = '---';
                errorMsg.style.display = 'block';
                return;
            }

            // Apply the user's flat interest rate formula: 
            // (((Monthly Amortization * Number of Months) - Principal) / Principal / Number of Months) * 100
            const totalPayment = A * n;
            const totalInterest = totalPayment - P;
            const monthlyPercent = (totalInterest / P / n) * 100;
            
            monthlyRateDisplay.classList.add('updating');
            setTimeout(() => monthlyRateDisplay.classList.remove('updating'), 300);
            
            monthlyRateDisplay.textContent = monthlyPercent.toFixed(2) + '%';
            resultBox.classList.add('has-value');
        }

        // Attach event listeners for real-time formatting and calculation
        [loanAmount, monthlyPayment, months].forEach(input => {
            input.addEventListener('input', function(e) {
                formatNumberInput(e.target);
            });
        });
    </script>
</body>
</html>
